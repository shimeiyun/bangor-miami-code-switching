<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Mean conservative code-switching rate by education group</title>
  <desc id="desc">Low group mean 13.63 with five participants, Middle 14.81 with 31 participants, and High 15.74 with 37 participants. Error bars show plus or minus one standard error.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#24292f">Conservative code-switching rate by education group</text>
  <text x="450" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Mean transitions per 1,000 valid English/Spanish tokens; error bars = ±1 SE</text>

  <line x1="100" y1="410" x2="840" y2="410" stroke="#8c959f" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="410" stroke="#8c959f" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="end">
    <text x="90" y="415">0</text>
    <text x="90" y="338">5</text>
    <text x="90" y="260">10</text>
    <text x="90" y="183">15</text>
    <text x="90" y="105">20</text>
  </g>
  <g stroke="#d8dee4" stroke-width="1">
    <line x1="100" y1="333" x2="840" y2="333"/>
    <line x1="100" y1="255" x2="840" y2="255"/>
    <line x1="100" y1="178" x2="840" y2="178"/>
    <line x1="100" y1="100" x2="840" y2="100"/>
  </g>

  <g fill="#4f46a5">
    <rect x="175" y="199" width="150" height="211" rx="4"/>
    <rect x="375" y="180" width="150" height="230" rx="4"/>
    <rect x="575" y="166" width="150" height="244" rx="4"/>
  </g>

  <g stroke="#24292f" stroke-width="2">
    <line x1="250" y1="122" x2="250" y2="276"/>
    <line x1="235" y1="122" x2="265" y2="122"/>
    <line x1="235" y1="276" x2="265" y2="276"/>
    <line x1="450" y1="148" x2="450" y2="212"/>
    <line x1="435" y1="148" x2="465" y2="148"/>
    <line x1="435" y1="212" x2="465" y2="212"/>
    <line x1="650" y1="139" x2="650" y2="193"/>
    <line x1="635" y1="139" x2="665" y2="139"/>
    <line x1="635" y1="193" x2="665" y2="193"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="250" y="190" font-size="17" font-weight="600" fill="#24292f">13.63</text>
    <text x="450" y="171" font-size="17" font-weight="600" fill="#24292f">14.81</text>
    <text x="650" y="157" font-size="17" font-weight="600" fill="#24292f">15.74</text>
    <text x="250" y="438" font-size="15" fill="#24292f">Low (levels 1–2)</text>
    <text x="450" y="438" font-size="15" fill="#24292f">Middle (level 3)</text>
    <text x="650" y="438" font-size="15" fill="#24292f">High (levels 4–5)</text>
    <text x="250" y="460" font-size="13" fill="#57606a">n = 5</text>
    <text x="450" y="460" font-size="13" fill="#57606a">n = 31</text>
    <text x="650" y="460" font-size="13" fill="#57606a">n = 37</text>
  </g>
  <text x="24" y="260" transform="rotate(-90 24 260)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#24292f">Switches per 1,000 valid tokens</text>
</svg>
